<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JESA BIM 3D - Monitoring Final Corrigé</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600&display=swap');
        body { margin: 0; background-color: #050505; overflow: hidden; font-family: 'Inter', sans-serif; }
        #hud { 
            position: absolute; top: 20px; left: 20px; color: white; 
            background: rgba(10, 10, 10, 0.95); padding: 20px; 
            border-left: 6px solid #ff6b00; z-index: 100; border-radius: 4px;
            min-width: 280px;
        }
        .logo { font-family: 'Orbitron', sans-serif; color: #ff6b00; font-size: 14px; margin-bottom: 15px; }
        .info-massif { font-size: 12px; line-height: 1.6; margin-bottom: 15px; color: #ccc; }
        .info-massif strong { color: #fff; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
        .val { color: #8B4513; font-weight: bold; }
        .val-green { color: #b08d57; font-weight: bold; }
        .val-white { color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        <div class="logo">JESA SMART MONITORING</div>
        <div class="info-massif">
            ID Massif : <strong>MS-ST-2024-001</strong><br>
            Type Béton : <strong>CEM III/A (Bas Carbone)</strong><br>
            Date Coulage : <strong>14/05/2026</strong>
        </div>
        <div class="data-row"><span>Type de Structure</span><strong id="txt-type" style="color: #ff6b00;">---</strong></div>
        <div class="data-row"><span id="lbl-n1">Cadres inf. pied poteau</span><span id="v-at" class="val-green">---</span></div>
        <div class="data-row"><span id="lbl-n2">Armatures d'angles</span><span id="v-ah" class="val">---</span></div>
        <div class="data-row"><span id="lbl-n3">Cerces de couture</span><span id="v-as" class="val-white">---</span></div>
    </div>

<script type="module">
import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

const p = new URLSearchParams(window.location.search);

const decode = (s) => s ? decodeURIComponent(s.replace(/\+/g, ' ')).replace(/_/g, ' ') : null;

const extractNb = (txt, fallback) => {
    const decoded = decode(txt);
    if (!decoded) return fallback;
    const match = decoded.match(/(\d+)/);
    return match ? parseInt(match[1], 10) : fallback;
};

// Extraction des paramètres de l'URL
const parts = (p.get('parts') || "0.40_0.30_0.40_0.40_0.30").split('_');
const h = parseFloat(p.get('h')) || 0.80;

// Depuis WinSemelle QR :
// as = armatures d'angles
// ah = cerces de couture
// at = cadres inf. pied poteau
const armaturesAnglesTxt = decode(p.get('as')) || "4 HA12";
const cercesCoutureTxt = decode(p.get('ah')) || "8 HA12";
const cadresInfTxt = decode(p.get('at')) || "4 HA10";

// Nombres réellement utilisés dans le modèle 3D
const nArmaturesAngles = extractNb(p.get('as'), 4);
const nCercesCouture = extractNb(p.get('ah'), 8);
const nCadresInfPoteau = extractNb(p.get('at'), 4);

// Compatibilité anciens paramètres
const n1 = parseInt(p.get('n1')) || nCadresInfPoteau;
const n2 = parseInt(p.get('n2')) || nCadresInfPoteau;
const nbCF = parseInt(p.get('nbCF')) || nCercesCouture;

document.getElementById('v-at').innerText = cadresInfTxt;
document.getElementById('v-ah').innerText = armaturesAnglesTxt;
document.getElementById('v-as').innerText = cercesCoutureTxt;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.01, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(ARButton.createButton(renderer));

const group = new THREE.Group();
scene.add(group);

// Matériaux globaux requis pour la structure
const matSocle = new THREE.MeshStandardMaterial({ color: 0x666666, transparent: true, opacity: 0.4 });
const matBeton = new THREE.MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: 0.3 });
const matBlanc = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 });
const matOrange = new THREE.MeshStandardMaterial({ color: 0xff6b00, metalness: 0.5 });

// Fonction utilitaire pour dessiner les arêtes des éléments 3D
function addEdges(mesh) {
    const edges = new THREE.EdgesGeometry(mesh.geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, opacity: 0.4, transparent: true }));
    mesh.add(line);
}

// --- INSERTION DE LA PARTIE SEMELLE À ENCUVEMENT ---
{
    document.getElementById('txt-type').innerText = "SEMELLE À ENCUVEMENT";
    document.getElementById('lbl-n1').innerText = "Cadres inf. pied poteau";
    document.getElementById('lbl-n2').innerText = "Armatures d'angles";
    document.getElementById('lbl-n3').innerText = "Cerces de couture";

    // --- 1. DÉFINITION DES MATÉRIAUX (COULEURS EXACTES DEMANDÉES) ---
    const matBeigeAs = new THREE.MeshStandardMaterial({ color: 0xF5F5DC, metalness: 0.5, roughness: 0.3 });
    const matJauneVifAt = new THREE.MeshStandardMaterial({ color: 0xFFFF00, metalness: 0.3, roughness: 0.2 });
    const matLineJauneVif = new THREE.LineBasicMaterial({ color: 0xFFFF00, linewidth: 2 });

    // --- 2. PARAMÈTRES GÉOMÉTRIQUES (AVEC DÉCROCHEMENT) ---
    const poteauA = parseFloat(parts[3]) || 0.40; 
    const eRadier = parseFloat(parts[4]) || 0.30; 
    
    const L_radier = 1.8;
    const L_enc = 1.1;
    const hf = h;
    const totalH = hf + eRadier;

    // --- 3. GÉOMÉTRIE : SOCLE / RADIER (BASE LARGE) ---
    const socle = new THREE.Mesh(new THREE.BoxGeometry(L_radier, eRadier, L_radier), matSocle);
    socle.position.y = -totalH / 2 + eRadier / 2;
    addEdges(socle);
    group.add(socle);

    // --- 4. GÉOMÉTRIE : FÛT CREUX EXTÉRIEUR RÉDUIT ---
    const s = new THREE.Shape();
    s.moveTo(-L_enc / 2, -L_enc / 2); 
    s.lineTo(L_enc / 2, -L_enc / 2); 
    s.lineTo(L_enc / 2, L_enc / 2); 
    s.lineTo(-L_enc / 2, L_enc / 2); 
    s.lineTo(-L_enc / 2, -L_enc / 2);
    
    const hole = new THREE.Path();
    hole.moveTo(-poteauA / 2, -poteauA / 2); 
    hole.lineTo(poteauA / 2, -poteauA / 2); 
    hole.lineTo(poteauA / 2, poteauA / 2); 
    hole.lineTo(-poteauA / 2, poteauA / 2); 
    hole.lineTo(-poteauA / 2, -poteauA / 2);
    s.holes.push(hole);
    
    const fut = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: hf, bevelEnabled: false }), matBeton);
    fut.rotation.x = Math.PI / 2; 
    fut.position.y = -totalH / 2 + eRadier + hf;
    addEdges(fut);
    group.add(fut);

    // --- 5. GÉOMÉTRIE : POTEAU PRÉFABRIQUÉ DANS LA POCHE ---
    const hPV = hf + 0.8;
    const poteau = new THREE.Mesh(new THREE.BoxGeometry(poteauA - 0.04, hPV, poteauA - 0.04), matBlanc);
    poteau.position.y = -totalH / 2 + eRadier + hPV / 2 - 0.05;
    addEdges(poteau);
    group.add(poteau);

    // --- 6. ARMATURES D'ANGLES SÉPARÉES AVEC CROCHETS EN U EN TÊTE ---
    const anglePositions = [
        { x: 1, z: 1 },
        { x: 1, z: -1 },
        { x: -1, z: 1 },
        { x: -1, z: -1 }
    ];

    const rayonArmatureAngle = 0.012;
    const espacementArmaturesAngle = 0.035;
    const ouvertureU = 0.05; // Largeur du crochet en U
    const longueurRetourU = 0.12; // Longueur de la patte de retour vers le bas

    const ajouterCrochetUEnTete = (x, z, sx, sz) => {
        const hauteurTop = -totalH / 2 + eRadier + hf + 0.1; // Niveau haut de la barre droite
        
        // Tracé du crochet en U à 180° (Aller vers le haut -> courbe à 180° -> retour vers le bas)
        const p1 = new THREE.Vector3(x, hauteurTop - 0.05, z);
        const p2 = new THREE.Vector3(x, hauteurTop, z);
        
        // Sommet de la boucle (décalage progressif vers l'intérieur de la section)
        const p3 = new THREE.Vector3(x - (ouvertureU / 2) * sx, hauteurTop + 0.04, z - (ouvertureU / 2) * sz);
        const p4 = new THREE.Vector3(x - ouvertureU * sx, hauteurTop, z - ouvertureU * sz);
        
        // Patte de retour du U descendant vers le bas
        const p5 = new THREE.Vector3(x - ouvertureU * sx, hauteurTop - longueurRetourU, z - ouvertureU * sz);

        const curve = new THREE.CatmullRomCurve3([p1, p2, p3, p4, p5]);
        const hook = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, rayonArmatureAngle, 8, false), matBeigeAs);
        addEdges(hook);
        group.add(hook);
    };

    for (let i = 0; i < nArmaturesAngles; i++) {
        const pos = anglePositions[i % anglePositions.length];
        const rang = Math.floor(i / anglePositions.length);
        const decalage = rang * espacementArmaturesAngle;

        const xBarre = ((poteauA / 2) - 0.05 - decalage) * pos.x;
        const zBarre = ((poteauA / 2) - 0.05 - decalage) * pos.z;

        // Corps principal droit de la barre arrêté juste avant le début de la courbure du U
        const hauteurTopBarre = -totalH / 2 + eRadier + hf + 0.05;
        const hauteurBaseBarre = poteau.position.y - hPV / 2;
        const longueurBarreDroite = hauteurTopBarre - hauteurBaseBarre;

        const bar = new THREE.Mesh(new THREE.CylinderGeometry(rayonArmatureAngle, rayonArmatureAngle, longueurBarreDroite, 8), matBeigeAs);
        bar.position.set(xBarre, hauteurBaseBarre + longueurBarreDroite / 2, zBarre);
        addEdges(bar);
        group.add(bar);

        ajouterCrochetUEnTete(xBarre, zBarre, pos.x, pos.z);
    }

    // --- 7. CADRES INF. PIED DE POTEAU : NOMBRE LIÉ À at ---
    for (let k = 0; k < nCadresInfPoteau; k++) {
        const yP = (poteau.position.y - hPV / 2) + ((k + 1) * hPV / (nCadresInfPoteau + 1));
        const dim = poteauA - 0.06;
        const pts = [
            new THREE.Vector3(-dim / 2, yP, -dim / 2), 
            new THREE.Vector3(dim / 2, yP, -dim / 2), 
            new THREE.Vector3(dim / 2, yP, dim / 2), 
            new THREE.Vector3(-dim / 2, yP, dim / 2), 
            new THREE.Vector3(-dim / 2, yP, -dim / 2)
        ];
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xF5F5DC })));
    }

    // --- 8. CERCES DE COUTURE : NOMBRE LIÉ À ah ---
    for (let k = 0; k < nCercesCouture; k++) {
        const dimF = L_enc - 0.12;
        const yF = -totalH / 2 + eRadier + (hf * (k + 1) / (nCercesCouture + 1));
        const ptsF = [
            new THREE.Vector3(-dimF / 2, yF, -dimF / 2), 
            new THREE.Vector3(dimF / 2, yF, -dimF / 2), 
            new THREE.Vector3(dimF / 2, yF, dimF / 2), 
            new THREE.Vector3(-dimF / 2, yF, dimF / 2), 
            new THREE.Vector3(-dimF / 2, yF, -dimF / 2)
        ];
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsF), matLineJauneVif));
    }

    // --- 9. FERRAILLAGE : NAPPE INFÉRIEURE DU RADIER ---
    const bL = -totalH / 2;
    
    for (let i = 0; i < n1; i++) {
        const bX = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, L_radier - 0.1, 8), matOrange);
        bX.rotation.x = Math.PI / 2; 
        bX.position.set(-(L_radier - 0.2) / 2 + (i * (L_radier - 0.2) / (n1 - 1 || 1)), bL + 0.07, 0);
        addEdges(bX);
        group.add(bX);
    }
    
    for (let j = 0; j < n2; j++) {
        const bY = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, L_radier - 0.1, 8), 
            new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8, roughness: 0.2 }) 
        );
        bY.rotation.z = Math.PI / 2; 
        bY.position.set(0, bL + 0.11, -(L_radier - 0.2) / 2 + (j * (L_radier - 0.2) / (n2 - 1 || 1)));
        addEdges(bY);
        group.add(bY);
    }
}

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(5, 10, 5);
scene.add(sun);

function animate() {
    renderer.setAnimationLoop(() => {
        if (!renderer.xr.isPresenting) {
            group.rotation.y += 0.005;
            camera.position.set(2.5, 1.5, 2.5);
            camera.lookAt(0, 0, 0);
        }
        renderer.render(scene, camera);
    });
}
animate();
</script>
</body>
</html>
